
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sevimlilər – Essen Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f5f5f5; min-height: 100vh; color: #111; }

    /* ── Nav ── */
    .top-nav {
      background: #e8222e; padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: relative;
    }
    .nav-back {
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.9); text-decoration: none;
      font-size: 17px; font-weight: 500; transition: color 0.15s;
    }
    .nav-back:hover { color: #fff; }
    .nav-logo {
      height: 44px; width: 140px; object-fit: contain;
      filter: brightness(0) invert(1);
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .nav-cart-btn {
      position: relative; background: rgba(255,255,255,0.15);
      border: none; border-radius: 10px; width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; cursor: pointer; transition: background 0.15s;
    }
    .nav-cart-btn:hover { background: rgba(255,255,255,0.25); }
    .cart-badge {
      position: absolute; top: -5px; right: -5px;
      background: #fff; color: #e8222e; font-size: 10px; font-weight: 700;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #e8222e;
    }

    /* ── Layout ── */
    .main-wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 40px; }
    .page-head { padding: 28px 0 20px; display: flex; align-items: center; gap: 10px; }
    .page-head h1 { font-size: 22px; font-weight: 700; color: #111; }
    .count-pill {
      background: #e8222e; color: #fff;
      font-size: 12px; font-weight: 500;
      padding: 3px 10px; border-radius: 20px;
    }

    /* ── Selection toolbar ── */
    .select-toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .select-all-wrap {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border: 1.5px solid #e5e7eb;
      border-radius: 10px; padding: 8px 14px;
      cursor: pointer; transition: border-color 0.15s; user-select: none;
    }
    .select-all-wrap:hover { border-color: #e8222e; }
    .master-checkbox {
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid #d1d5db; background: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0; position: relative;
    }
    .master-checkbox.checked { background: #e8222e; border-color: #e8222e; }
    .master-checkbox.checked::after {
      content: ''; display: block;
      width: 5px; height: 9px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .master-checkbox.indeterminate { border-color: #e8222e; }
    .master-checkbox.indeterminate::after {
      content: ''; width: 10px; height: 2px;
      background: #e8222e; border-radius: 2px;
    }
    .select-all-label { font-size: 13px; font-weight: 500; color: #374151; }

    .delete-selected-btn {
      display: flex; align-items: center; gap: 7px;
      background: #fff5f5; border: 1.5px solid #fecaca;
      border-radius: 10px; padding: 8px 14px;
      cursor: pointer; color: #e8222e;
      font-size: 13px; font-weight: 500;
      font-family: 'Poppins', sans-serif;
      transition: all 0.15s;
      opacity: 0.4; pointer-events: none;
    }
    .delete-selected-btn.active { opacity: 1; pointer-events: auto; }
    .delete-selected-btn.active:hover {
      background: #e8222e; color: #fff; border-color: #e8222e;
    }
    .sel-count-badge {
      font-size: 11px; background: #e8222e; color: #fff;
      padding: 2px 8px; border-radius: 20px; display: none;
    }
    .sel-count-badge.visible { display: inline-block; }

    /* ── Fav item card ── */
    .fav-items-grid {
      display: flex; flex-direction: column; gap: 10px;
    }

    .fav-item {
      background: #fff; border-radius: 16px;
      padding: 14px 16px; display: flex; gap: 14px; align-items: center;
      border: 1.5px solid #f0f0f0; transition: box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .fav-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .fav-item.selected { border-color: #e8222e; background: #fff8f8; }

    .item-checkbox {
      width: 22px; height: 22px; border-radius: 7px;
      border: 2px solid #d1d5db; background: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s; position: relative;
    }
    .fav-item.selected .item-checkbox { background: #e8222e; border-color: #e8222e; }
    .fav-item.selected .item-checkbox::after {
      content: ''; display: block;
      width: 5px; height: 10px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .item-img {
      width: 76px; height: 76px; min-width: 76px;
      border-radius: 10px; background: #f5f5f5;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .item-img img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
    .item-img i { font-size: 24px; color: #ddd; }

    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 13px; font-weight: 500; color: #1f2937; line-height: 1.4; margin-bottom: 4px; }
    .item-price { font-size: 16px; font-weight: 700; color: #e8222e; margin-bottom: 10px; }

    /* ── Add to cart button ── */
    .add-cart-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: 10px;
      border: 1.5px solid #e8222e; background: #e8222e; color: #fff;
      font-size: 12px; font-weight: 600; font-family: 'Poppins', sans-serif;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .add-cart-btn:hover { background: #c0000a; border-color: #c0000a; }
    .add-cart-btn.in-cart {
      background: #fff; color: #16a34a;
      border-color: #16a34a;
    }
    .add-cart-btn.in-cart:hover { background: #f0fdf4; }
    .add-cart-btn i { font-size: 13px; }

    /* ── Delete (heart-break) button ── */
    .delete-btn {
      width: 34px; height: 34px; border-radius: 9px;
      border: 1.5px solid #fecaca; background: #fff5f5;
      cursor: pointer; color: #e8222e; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .delete-btn:hover { background: #e8222e; color: #fff; border-color: #e8222e; }

    .item-actions {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }

    /* ── Empty state ── */
    .empty-state {
      background: #fff; border-radius: 20px; border: 1px solid #f0f0f0;
      padding: 60px 20px; text-align: center;
      display: none; flex-direction: column; align-items: center; gap: 14px;
    }
    .empty-icon {
      width: 72px; height: 72px; background: #fff0f0;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #e8222e; margin: 0 auto 8px;
    }
    .empty-state h2 { font-size: 18px; font-weight: 600; color: #111; margin-bottom: 6px; }
    .empty-state p { font-size: 13px; color: #9ca3af; margin-bottom: 16px; }
    .empty-btn {
      padding: 11px 28px; background: #e8222e; color: #fff;
      border: none; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: 'Poppins', sans-serif;
      text-decoration: none; display: inline-block; transition: background 0.15s;
    }
    .empty-btn:hover { background: #c0000a; }

    @media (max-width: 600px) {
      .top-nav { padding: 0 14px; }
      .item-name { font-size: 12px; }
      .add-cart-btn span { display: none; }
      .add-cart-btn { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="nav-back">
    <i class="fa-solid fa-arrow-left" style="font-size:20px;"></i>
    Alış-verişə davam et
  </a>
  
  <button class="nav-cart-btn" onclick="window.location.href='cart.html'">
    <i class="fa-solid fa-cart-shopping" style="font-size:17px;"></i>
    <span id="nav-cart-count" class="cart-badge" style="display:none;">0</span>
  </button>
</nav>

<div class="main-wrap">
  <div class="page-head">
    <h1>Sevimlilər</h1>
    <span class="count-pill" id="count-pill" style="display:none;"></span>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="empty-state">
    <div class="empty-icon"><i class="fa-solid fa-heart"></i></div>
    <h2>Sevimliləriniz boşdur</h2>
    <p>Bəyəndiyiniz məhsulları sevimlilərə əlavə edin</p>
    <a href="index.html" class="empty-btn">Alış-verişə başla</a>
  </div>

  <!-- Main content -->
  <div id="fav-content" style="display:none;">
    <div class="select-toolbar">
      <div class="select-all-wrap" onclick="toggleSelectAll()">
        <div class="master-checkbox" id="masterCheck"></div>
        <span class="select-all-label">Hamısını seç</span>
      </div>
      <button class="delete-selected-btn" id="deleteSelectedBtn" onclick="deleteSelected()">
        <i class="fa-solid fa-trash-can"></i>
        Seçiləni sil
        <span class="sel-count-badge" id="selCountBadge">0</span>
      </button>
    </div>
    <div class="fav-items-grid" id="fav-items"></div>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/api';

  let favourites  = [];      // full list from server
  let cartIds     = new Set(); // product ids already in cart
  let selectedIds = new Set();

  function getToken() { return localStorage.getItem('token'); }

  // ── Nav cart badge ────────────────────────────────────────
  async function updateCartBadge() {
    let total = 0;
    const token = getToken();
    try {
      if (token) {
        const response = await fetch(`${API}/cart`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          const cart = await response.json();
          total = cart.reduce((sum, item) => sum + Number(item.quantity || 1), 0);
        }
      } else {
        const cart = JSON.parse(localStorage.getItem('essenCart')) || [];
        total = cart.reduce((sum, item) => sum + Number(item.qty || 1), 0);
      }
      const el = document.getElementById('nav-cart-count');
      el.textContent = total;
      el.style.display = total > 0 ? 'flex' : 'none';
    } catch {}
  }

  // ── Fetch current cart to know which items are already in ─
  async function fetchCartIds() {
    const token = getToken();
    if (token) {
      try {
        const res = await fetch(`${API}/cart`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        data.forEach(i => cartIds.add(i.product.id));
      } catch {}
    } else {
      try {
        const local = JSON.parse(localStorage.getItem('essenCart')) || [];
        local.forEach(i => cartIds.add(i.id));
      } catch {}
    }
  }

  // ── Fetch favourites ──────────────────────────────────────
  async function fetchFavourites() {
    const token = getToken();
    try {
      const res = await fetch(`${API}/favourites`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      favourites = data.map(f => ({
        favId:     f.id,
        id:        f.product.id,
        name:      f.product.name,
        price:     parseFloat(f.product.price),
        image:     f.product.image
      }));
    } catch {
      favourites = [];
    }
  }

  // ── Add single item to cart ───────────────────────────────
  async function addToCart(productId, btn) {
    btn.stopPropagation && btn.stopPropagation();

    // if already in cart, do nothing (or go to cart)
    if (cartIds.has(productId)) {
      window.location.href = 'cart.html';
      return;
    }

    const token = getToken();
    if (token) {
      try {
        await fetch(`${API}/cart`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ productId, quantity: 1 })
        });
      } catch { alert('Xəta baş verdi'); return; }
    } else {
      const cart = JSON.parse(localStorage.getItem('essenCart') || '[]');
      const existing = cart.find(i => i.id === productId);
      if (existing) { existing.qty += 1; }
      else {
        const fav = favourites.find(f => f.id === productId);
        cart.push({ id: fav.id, name: fav.name, price: fav.price, qty: 1, image: fav.image });
      }
      localStorage.setItem('essenCart', JSON.stringify(cart));
    }

    cartIds.add(productId);
    localStorage.setItem('essenCartChanged', String(Date.now()));
    updateCartBadge();

    // update just this button
    const btnEl = document.querySelector(`.add-cart-btn[data-id="${productId}"]`);
    if (btnEl) setCartBtnState(btnEl, true);
  }

  function setCartBtnState(btn, inCart) {
    if (inCart) {
      btn.classList.add('in-cart');
      btn.innerHTML = `<i class="fa-solid fa-check"></i><span>Səbətdə</span>`;
    } else {
      btn.classList.remove('in-cart');
      btn.innerHTML = `<i class="fa-solid fa-cart-shopping"></i><span>Səbətə at</span>`;
    }
  }

  // ── Remove single favourite ───────────────────────────────
  async function removeFavourite(productId, e) {
    e.stopPropagation();
    const token = getToken();
    try {
      await fetch(`${API}/favourites/${productId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
    } catch { alert('Xəta baş verdi'); return; }
    selectedIds.delete(productId);
    favourites = favourites.filter(f => f.id !== productId);
    render();
  }

  // ── Select / deselect ─────────────────────────────────────
  function toggleItemSelect(productId) {
    if (selectedIds.has(productId)) selectedIds.delete(productId);
    else selectedIds.add(productId);
    updateToolbar();
    document.querySelectorAll('.fav-item').forEach(el => {
      el.classList.toggle('selected', selectedIds.has(parseInt(el.dataset.id)));
    });
    updateMasterCheckbox();
  }

  function toggleSelectAll() {
    const allSelected = favourites.every(f => selectedIds.has(f.id));
    if (allSelected) selectedIds.clear();
    else favourites.forEach(f => selectedIds.add(f.id));
    updateToolbar();
    document.querySelectorAll('.fav-item').forEach(el => {
      el.classList.toggle('selected', selectedIds.has(parseInt(el.dataset.id)));
    });
    updateMasterCheckbox();
  }

  async function deleteSelected() {
    if (selectedIds.size === 0) return;
    const token = getToken();
    for (const productId of selectedIds) {
      try {
        await fetch(`${API}/favourites/${productId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
      } catch { alert('Xəta baş verdi'); return; }
    }
    favourites = favourites.filter(f => !selectedIds.has(f.id));
    selectedIds.clear();
    render();
  }

  function updateMasterCheckbox() {
    const mc = document.getElementById('masterCheck');
    if (!mc || favourites.length === 0) return;
    const allSel  = favourites.every(f => selectedIds.has(f.id));
    const someSel = favourites.some(f => selectedIds.has(f.id));
    mc.className = 'master-checkbox' + (allSel ? ' checked' : someSel ? ' indeterminate' : '');
  }

  function updateToolbar() {
    const count = selectedIds.size;
    const btn   = document.getElementById('deleteSelectedBtn');
    const badge = document.getElementById('selCountBadge');
    if (!btn) return;
    btn.classList.toggle('active', count > 0);
    badge.classList.toggle('visible', count > 0);
    badge.textContent = count;
  }

  // ── Render ────────────────────────────────────────────────
  function render() {
    const emptyEl   = document.getElementById('empty-state');
    const contentEl = document.getElementById('fav-content');
    const itemsEl   = document.getElementById('fav-items');
    const pill      = document.getElementById('count-pill');

    if (favourites.length === 0) {
      emptyEl.style.display   = 'flex';
      contentEl.style.display = 'none';
      pill.style.display      = 'none';
      return;
    }

    emptyEl.style.display   = 'none';
    contentEl.style.display = 'block';
    pill.style.display      = 'inline-block';
    pill.textContent        = favourites.length + ' məhsul';

    itemsEl.innerHTML = '';

    favourites.forEach(item => {
      const el = document.createElement('div');
      el.className = 'fav-item' + (selectedIds.has(item.id) ? ' selected' : '');
      el.dataset.id = item.id;
      el.onclick = () => toggleItemSelect(item.id);

      const inCart = cartIds.has(item.id);
      el.innerHTML = `
        <div class="item-checkbox"></div>
        <div class="item-img">
          ${item.image
            ? `<img src="http://localhost:3000${item.image}" alt="${item.name}">`
            : `<i class="fa-solid fa-box"></i>`}
        </div>
        <div class="item-info">
          <p class="item-name">${item.name}</p>
          <p class="item-price">${item.price.toFixed(2)} ₼</p>
        </div>
        <div class="item-actions">
          <button class="add-cart-btn ${inCart ? 'in-cart' : ''}"
                  data-id="${item.id}"
                  onclick="(function(e){ e.stopPropagation(); addToCart(${item.id}, e); })(event)">
            ${inCart
              ? `<i class="fa-solid fa-check"></i><span>Səbətdə</span>`
              : `<i class="fa-solid fa-cart-shopping"></i><span>Səbətə at</span>`}
          </button>
          <button class="delete-btn"
                  onclick="(function(e){ removeFavourite(${item.id}, e); })(event)"
                  title="Sil">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>`;

      itemsEl.appendChild(el);
    });

    updateMasterCheckbox();
    updateToolbar();
  }

  // ── Init ──────────────────────────────────────────────────
  async function init() {
    updateCartBadge();
    await fetchCartIds();
    await fetchFavourites();
    render();
  }

  window.addEventListener('storage', event => {
    if (event.key === 'essenCartChanged' || event.key === 'essenCart') updateCartBadge();
  });
  window.addEventListener('focus', updateCartBadge);
  window.addEventListener('pageshow', updateCartBadge);
  init();
</script>
</body>
</html>
